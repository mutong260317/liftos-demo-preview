name: QA

on:
  push:
    branches: [main, "feature/**", "hotfix/**"]
  pull_request:
    branches: [main]

jobs:
  functional-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-fund --no-audit playwright-core
      - name: Install Chromium deps
        run: npx --yes playwright install chromium --with-deps
      - name: Run V0.2 suite
        run: node scripts/qa-v02.js
      - name: Run review-fix suite
        run: node scripts/qa-review-fixes.js
      - name: Run V0.2.1 data safety suite
        run: node scripts/qa-v021-data-safety.js
      - name: Run V0.3 gym experience suite
        run: node scripts/qa-v03-gym-experience.js
      - name: Run V0.3.1 stabilization suite
        run: node scripts/qa-v031-stabilization.js
      - name: Run SW HTTP offline smoke
        run: node scripts/qa-v031-sw-http.js
      - name: Syntax check JS
        run: |
          node --check js/migrations.js
          node --check js/data.js
          node --check js/storage.js
          node --check js/stats.js
          node --check js/progression.js
          node --check js/plans.js
          node --check js/workout.js
          node --check js/gym.js
          node --check js/app.js
      - name: Run V0.3 round 5 volume suite
        run: node scripts/qa-v03-round5-volume.js
